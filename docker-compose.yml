x-default-build-args: &default-build-args
  TZ: "${TZ}"

x-default-logging: &default-logging
  driver: local
  options:
    max-size: "1G"
    max-file: "1"
    compress: "false"

services:
  media-api:
    build: {context: ., dockerfile: Dockerfile, args: {<<: *default-build-args}}
    env_file: [.env]
    command: python -m uvicorn media_api.api:app --host 0.0.0.0 --port 5556
    restart: unless-stopped
    volumes: [".:/app", "./media-runtime:/app/media-runtime"]
    ports: ["127.0.0.1:5556:5556"]
    networks: [bot-network]
  media-worker:
    build: {context: ., dockerfile: Dockerfile, args: {<<: *default-build-args}}
    env_file: [.env]
    command: python -m media_api.worker
    restart: unless-stopped
    volumes: [".:/app", "./media-runtime:/app/media-runtime"]
    networks: [bot-network]
    depends_on: [bgutil-provider, configuration-webserver]
  app:
    build:
      context: .
      dockerfile: Dockerfile
      args:
        <<: *default-build-args
    env_file:
      - .env
    restart: unless-stopped
    logging: *default-logging
    depends_on:
      - bgutil-provider
      - configuration-webserver
    volumes:
      - .:/app
    ports:
      # Dashboard - only exposed to localhost (tunnel routes external traffic)
      - "127.0.0.1:5555:5555"
    networks:
      - bot-network

  cloudflared:
    image: cloudflare/cloudflared:latest
    container_name: cloudflared
    command: tunnel run --token ${TUNNEL_TOKEN}
    environment:
      - TUNNEL_TOKEN=${TUNNEL_TOKEN}
    restart: unless-stopped
    logging: *default-logging
    networks:
      - bot-network
    # No ports exposed - tunnel is outbound only
    depends_on:
      - app

  bgutil-provider:
    image: brainicism/bgutil-ytdlp-pot-provider:latest
    restart: unless-stopped
    logging: *default-logging
    expose:
      - "4416"

  configuration-webserver:
    image: caddy:2-alpine
    restart: unless-stopped
    logging: *default-logging
    cap_add:
      - NET_ADMIN
    volumes:
      - ./docker/configuration-webserver/conf:/etc/caddy:ro
      - ./docker/configuration-webserver/site:/srv:ro
      - ./docker/configuration-webserver/data:/data
      - ./docker/configuration-webserver/config:/config
    networks:
      - bot-network

networks:
  bot-network:
    driver: bridge
